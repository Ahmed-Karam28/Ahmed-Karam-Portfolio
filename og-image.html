<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ahmed Karam - OG Image</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            width: 1200px;
            height: 630px;
            overflow: hidden;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Roboto', 'Oxygen', 'Ubuntu', 'Cantarell', sans-serif;
        }

        .og-container {
            width: 1200px;
            height: 630px;
            background: #020617;
            position: relative;
            overflow: hidden;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        /* Animated background effects */
        .bg-gradient {
            position: absolute;
            inset: 0;
            background: linear-gradient(135deg, #020617 0%, #0a1628 50%, #020617 100%);
        }

        .dot-pattern {
            position: absolute;
            inset: 0;
            opacity: 0.2;
            background-image: radial-gradient(circle at 1px 1px, rgba(6, 182, 212, 0.15) 1px, transparent 0);
            background-size: 40px 40px;
        }

        .orb1 {
            position: absolute;
            top: -100px;
            left: 200px;
            width: 500px;
            height: 500px;
            background: rgba(6, 182, 212, 0.15);
            border-radius: 50%;
            filter: blur(120px);
        }

        .orb2 {
            position: absolute;
            top: 100px;
            right: 150px;
            width: 400px;
            height: 400px;
            background: rgba(59, 130, 246, 0.1);
            border-radius: 50%;
            filter: blur(100px);
        }

        .orb3 {
            position: absolute;
            bottom: 50px;
            left: 400px;
            width: 350px;
            height: 350px;
            background: rgba(168, 85, 247, 0.08);
            border-radius: 50%;
            filter: blur(90px);
        }

        .vignette {
            position: absolute;
            inset: 0;
            background: radial-gradient(circle at 50% 50%, transparent 0%, rgba(2, 6, 23, 0.4) 100%);
        }

        /* Content */
        .content {
            position: relative;
            z-index: 10;
            width: 100%;
            max-width: 1000px;
            padding: 0 80px;
            display: flex;
            flex-direction: column;
            gap: 24px;
        }

        /* Logo/Brand */
        .brand {
            display: flex;
            align-items: center;
            gap: 12px;
            margin-bottom: 8px;
        }

        .brand-icon {
            width: 48px;
            height: 48px;
            background: rgba(6, 182, 212, 0.1);
            border: 1px solid rgba(6, 182, 212, 0.3);
            border-radius: 12px;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .shield-icon {
            width: 28px;
            height: 28px;
            fill: none;
            stroke: #06b6d4;
            stroke-width: 2;
            stroke-linecap: round;
            stroke-linejoin: round;
        }

        .brand-text {
            font-size: 28px;
            font-weight: 700;
            letter-spacing: -0.5px;
            color: white;
        }

        .brand-text span {
            color: #64748b;
        }

        /* Main heading */
        .main-heading {
            font-size: 72px;
            font-weight: 700;
            line-height: 1.1;
            color: white;
            letter-spacing: -2px;
            margin: 0;
        }

        .gradient-text {
            background: linear-gradient(135deg, #06b6d4 0%, #3b82f6 50%, #8b5cf6 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }

        /* Subtitle */
        .subtitle {
            font-size: 26px;
            color: #94a3b8;
            line-height: 1.4;
            max-width: 800px;
        }

        .subtitle strong {
            color: white;
            font-weight: 600;
        }

        /* Skills badges */
        .skills {
            display: flex;
            gap: 16px;
            flex-wrap: wrap;
            margin-top: 8px;
        }

        .skill-badge {
            padding: 10px 20px;
            background: rgba(15, 23, 42, 0.8);
            border: 1px solid rgba(100, 116, 139, 0.3);
            border-radius: 8px;
            font-size: 16px;
            font-weight: 500;
            color: #06b6d4;
            backdrop-filter: blur(8px);
        }

        /* Status indicator */
        .status {
            display: flex;
            align-items: center;
            gap: 8px;
            font-size: 15px;
            color: #06b6d4;
            font-family: 'Courier New', monospace;
            margin-top: 4px;
        }

        .status-dot {
            width: 8px;
            height: 8px;
            background: #06b6d4;
            border-radius: 50%;
            box-shadow: 0 0 12px rgba(6, 182, 212, 0.8);
        }

        /* Decorative line */
        .deco-line {
            position: absolute;
            top: 60px;
            right: 80px;
            display: flex;
            align-items: center;
            gap: 12px;
            font-family: 'Courier New', monospace;
            font-size: 14px;
            color: #06b6d4;
        }

        .deco-line::before {
            content: '';
            width: 60px;
            height: 1px;
            background: #06b6d4;
        }

        /* Bottom accent */
        .accent-bar {
            position: absolute;
            bottom: 0;
            left: 0;
            right: 0;
            height: 4px;
            background: linear-gradient(90deg, #06b6d4 0%, #3b82f6 50%, #8b5cf6 100%);
        }
    </style>
</head>
<body>
    <div class="og-container">
        <!-- Background layers -->
        <div class="bg-gradient"></div>
        <div class="dot-pattern"></div>
        <div class="orb1"></div>
        <div class="orb2"></div>
        <div class="orb3"></div>
        <div class="vignette"></div>

        <!-- Decorative elements -->
        <div class="deco-line">PORTFOLIO 2025</div>

        <!-- Main content -->
        <div class="content">
            <!-- Brand -->
            <div class="brand">
                <div class="brand-icon">
                    <svg class="shield-icon" viewBox="0 0 24 24">
                        <path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"></path>
                        <polyline points="9 12 11 14 15 10"></polyline>
                    </svg>
                </div>
                <div class="brand-text">
                    AHMED<span>.SEC</span>
                </div>
            </div>

            <!-- Status -->
            <div class="status">
                <div class="status-dot"></div>
                <span>System Active • Cairo, EG</span>
            </div>

            <!-- Main heading -->
            <h1 class="main-heading">
                AHMED <span class="gradient-text">KARAM</span>
            </h1>

            <!-- Subtitle -->
            <p class="subtitle">
                Software Engineering Student specializing in <strong>QA Testing</strong>, <strong>Cybersecurity</strong> & <strong>Full-Stack Development</strong>
            </p>

            <!-- Skills -->
            <div class="skills">
                <div class="skill-badge">ISTQB Certified</div>
                <div class="skill-badge">Selenium</div>
                <div class="skill-badge">React</div>
                <div class="skill-badge">Network Security</div>
            </div>
        </div>

        <!-- Bottom accent -->
        <div class="accent-bar"></div>
    </div>
</body>
</html>
